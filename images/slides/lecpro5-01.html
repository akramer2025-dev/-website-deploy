<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal','Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0529,#200a4a,#0f0529);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.card{text-align:center;padding:60px 40px;max-width:700px}.icon{font-size:80px;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(131,56,236,.7))}.title{font-size:36px;font-weight:900;margin-bottom:16px;background:linear-gradient(45deg,#8338ec,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{font-size:20px;color:rgba(255,255,255,.85);line-height:1.8;margin-bottom:30px}.badge{display:inline-block;background:linear-gradient(45deg,#8338ec,#c084fc);padding:10px 30px;border-radius:50px;font-size:16px;font-weight:700;color:#fff}.module{display:inline-block;background:rgba(131,56,236,.15);border:1px solid rgba(131,56,236,.4);padding:6px 20px;border-radius:30px;font-size:14px;color:#c084fc;margin-bottom:16px}</style></head><body><div class="card"><div class="icon">🌐</div><div class="module">الوحدة الخامسة</div><div class="title">موقعك بالذكاء الاصطناعي</div><div class="subtitle">بدون برمجة · بدون مصمم · موقع احترافي جاهز في ساعات</div><div class="badge">كورس التسويق الاحترافي – مع أكرم مصطفى</div></div></body></html>
