<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal','Segoe UI',sans-serif;background:linear-gradient(135deg,#1a0a0a,#3d1010,#1a0a2e);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.card{text-align:center;padding:60px 40px;max-width:700px}.icon{font-size:80px;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(255,107,107,.7))}.title{font-size:36px;font-weight:900;margin-bottom:16px;background:linear-gradient(45deg,#ff6b6b,#ffa8a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{font-size:20px;color:rgba(255,255,255,.85);line-height:1.8;margin-bottom:30px}.badge{display:inline-block;background:linear-gradient(45deg,#ff6b6b,#ffa8a8);padding:10px 30px;border-radius:50px;font-size:16px;font-weight:700;color:#fff}.module{display:inline-block;background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.4);padding:6px 20px;border-radius:30px;font-size:14px;color:#ffa8a8;margin-bottom:16px}</style></head><body><div class="card"><div class="icon">📱</div><div class="module">الوحدة الثانية</div><div class="title">إنشاء المنصات وتفعيلها</div><div class="subtitle">فيسبوك · إنستجرام · تيك توك · واتساب بيزنس — كيف تُنشئهم باحتراف؟</div><div class="badge">كورس التسويق الاحترافي – مع أكرم مصطفى</div></div></body></html>
